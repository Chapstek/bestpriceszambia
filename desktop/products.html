<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Loyalbir</title>
    <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-top">
            <div class="logo">
                <img src="loyalbir.png" alt="Loyalbir" style="height: 150px;">
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="I am looking for..." aria-label="Search products">
                <button type="button" class="search-btn" id="search-btn">Search</button>
            </div>
            <div class="user-actions">
                <span class="action-icon" id="user-greeting">Hello, Guest</span>
                <span class="action-icon" id="compare-count">Compare (0)</span>
                <span class="action-icon" id="wishlist-count">Wishlist (0)</span>
                <span class="action-icon" id="cart-count">Cart (0)</span>
                <a href="cart.html" class="action-icon">View Cart</a>
                <button type="button" class="action-icon" id="logout-btn" hidden style="background: none; border: none; padding: 0; cursor: pointer;">Logout</button>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html" id="nav-home">Home</a></li>
       <!--         <li><a href="sellers.html" id="nav-sellers">Sellers</a></li>   -->
                <li><a href="brands.html" id="nav-brands">All Brands</a></li>
                <li><a href="categories.html" id="nav-categories">All Categories</a></li>
                <li><a href="products.html" id="nav-products">Products</a></li>
       <!--         <li><a href="services.html" id="nav-services">Services</a></li> -->
            </ul>
        </nav>
    </header>

    <!-- Breadcrumb Navigation -->
    <div class="breadcrumb" id="breadcrumb">
        <!-- Breadcrumb will be dynamically populated -->
    </div>

    <!-- Main Content -->
    <main>
        <section class="products">
            <div class="section-header">
                <h2 id="products-title">All Products</h2>
            </div>
            <!-- Swiper Carousel -->
            <div class="swiper swiper-container">
                <div class="swiper-wrapper" id="product-list">
                    <!-- Products will be dynamically added here -->
                </div>
                <!-- Navigation Arrows -->
                <div class="swiper-button-prev" aria-label="Previous products"></div>
                <div class="swiper-button-next" aria-label="Next products"></div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="#">About Us</a>
            <a href="#">Contact</a>
            <a href="#">Terms of Service</a>
            <a href="#">Privacy Policy</a>
        </div>
        <div class="newsletter">
            <h3>Subscribe to Our Newsletter</h3>
            <form id="newsletter-form">
                <input type="email" id="newsletter-email" placeholder="Your email" required>
                <button type="submit">Subscribe</button>
            </form>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
    <script src="session-ui.js"></script>
    <script src="products.js"></script>
</body>
</html>
