<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Products - Loyalbir</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo">
                <img src="loyalbir.png" alt="Loyalbir logo" style="height: 150px;">
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="I am looking for...">
                <button class="search-btn" id="search-btn">Search</button>
            </div>
            <div class="user-actions">
                <span class="action-icon" id="user-greeting">Hello, Guest</span>
                <a href="compare.html" class="action-icon" id="compare-count">Compare (0)</a>
                <span class="action-icon" id="wishlist-count">Wishlist (0)</span>
                <span class="action-icon" id="cart-count">Cart (0)</span>
                <a href="cart.html" class="action-icon">View Cart</a>
                <button type="button" class="action-icon action-button" id="logout-btn" hidden>Logout</button>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html" id="nav-home">Home</a></li>
                <li><a href="brands.html" id="nav-brands">All Brands</a></li>
                <li><a href="categories.html" id="nav-categories">All Categories</a></li>
                <li><a href="products.html" id="nav-products">Products</a></li>
            </ul>
        </nav>
    </header>

    <div class="breadcrumb" id="breadcrumb">
        <a href="index.html">Home</a><span class="separator">></span><span>Compare</span>
    </div>

    <main>
        <section class="products">
            <div class="section-header">
                <h2>Compare Products</h2>
                <button type="button" class="search-btn" id="clear-compare-btn">Clear Compare</button>
            </div>
            <div class="product-list" id="compare-list"></div>
        </section>
    </main>

    <footer>
        <div class="footer-links">
            <a href="#">About Us</a>
            <a href="#">Contact</a>
            <a href="#">Terms of Service</a>
            <a href="#">Privacy Policy</a>
        </div>
        <div class="newsletter">
            <h3>Subscribe to Our Newsletter</h3>
            <form id="newsletter-form">
                <input type="email" id="newsletter-email" placeholder="Your email" required>
                <button type="submit">Subscribe</button>
            </form>
        </div>
    </footer>

    <script src="session-ui.js"></script>
    <script src="compare-shared.js"></script>
    <script src="compare.js"></script>
</body>
</html>
