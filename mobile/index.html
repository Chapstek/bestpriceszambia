<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loyalbir – Tech & More</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" 
          integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" 
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://unpkg.com/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-top">
            <div class="logo">
                <a href="index.html" aria-label="Loyalbir Home">
                    <img src="loyalbir.png" alt="Loyalbir logo" width="140" height="40">
                </a>
            </div>
            
            <div class="search-bar">
                <input type="search" id="search-input" placeholder="Search products…" aria-label="Search products">
                <button class="search-btn" id="search-btn" aria-label="Search">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div class="user-actions">
                <a href="compare.html" class="action-icon" id="compare-count" aria-label="Compare products">
                    Compare (<span>0</span>)
                </a>
                <a href="wishlist.html" class="action-icon" id="wishlist-count" aria-label="Wishlist">
                    Wishlist (<span>0</span>)
                </a>
                <a href="cart.html" class="action-icon" id="cart-count" aria-label="Shopping cart">
                    Cart (<span>0</span>)
                </a>
                <a href="cart.html" class="action-icon view-cart-btn">View Cart</a>

                <!-- New: User Greeting + Logout -->
                <div class="user-greeting" id="user-greeting" style="margin-left: 15px; font-weight: 500;">
                    Hi, <span id="first-name">Guest</span>
                </div>
                <a href="#" id="logout-btn" style="margin-left: 10px; color: #dc3545; text-decoration: none;">Logout</a>

            </div>
        </div>

        <button type="button" class="hamburger" aria-label="Toggle main menu" aria-expanded="false" aria-controls="main-nav">
            <span class="sr-only">Menu</span>
            <span aria-hidden="true">☰</span>
        </button>

        <nav class="top-nav" id="main-nav" aria-label="Main navigation">
            <ul role="list">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="sellers.html">Sellers</a></li>
                <li><a href="brands.html">All Brands</a></li>
                <li><a href="categories.html">All Categories</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="services.html">Services</a></li>
            </ul>
        </nav>
        <div class="nav-overlay" aria-hidden="true"></div>
    </header>

    <div class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb" aria-live="polite"></div>

    <main>
        <section class="products" aria-labelledby="new-products-heading">
            <div class="section-header">
                <h1 id="new-products-heading">New Products</h1>
                <a href="products.html" class="view-all">View all new products →</a>
            </div>

            <div class="swiper">
                <div class="swiper-wrapper" id="product-list"></div>
                <div class="swiper-pagination"></div>
                <div class="swiper-button-prev" aria-label="Previous product"></div>
                <div class="swiper-button-next" aria-label="Next product"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-links">
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <a href="terms.html">Terms of Service</a>
            <a href="privacy.html">Privacy Policy</a>
        </div>
        <!-- Optional Newsletter -->
        <div class="newsletter">
            <form id="newsletter-form">
                <label for="newsletter-email">Subscribe to our newsletter</label><br><br><br>
                <div class="newsletter-input">
                    <input type="email" id="newsletter-email" placeholder="your@email.com" required>
                    <button type="submit">Subscribe</button>
                </div>
            </form>
        </div>
    </footer>

    <nav class="bottom-nav" aria-label="Main mobile navigation">
        <ul>
            <li><a href="index.html" class="active"><i class="fas fa-home"></i><span class="label">Home</span></a></li>
            <li><a href="categories.html"><i class="fas fa-th-large"></i><span class="label">Categories</span></a></li>
            <li><a href="sellers.html"><i class="fas fa-bell"></i><span class="label">Notifications</span></a></li>
            <li><a href="compare.html"><i class="fas fa-balance-scale"></i><span class="label">Compare</span></a></li>
            <li><a href="wishlist.html"><i class="fas fa-heart"></i><span class="label">Wishlist</span></a></li>
        </ul>
    </nav>

    <!-- Scripts -->
    <script src="https://unpkg.com/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
    <script src="index.js"></script>
</body>
</html>
